plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.webremote'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.webremote'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Set by the GitHub workflow from its secrets, so every build is signed with the same key and installs over the last one.
        if (System.getenv('SIGNING_KEYSTORE_FILE')) {
            ci {
                storeFile file(System.getenv('SIGNING_KEYSTORE_FILE'))
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded, never published: the workflow's key when it is set, else the local debug key.
            signingConfig System.getenv('SIGNING_KEYSTORE_FILE') ? signingConfigs.ci : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
