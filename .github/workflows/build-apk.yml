name: Build APK

# Run it from the Actions tab (Run workflow). It builds the signed APK and puts it on a new Release to download.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --console=plain
      - name: Build the signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk web-remote.apk
      - name: Publish a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" web-remote.apk \
            --title "Web Remote build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Same signing key every time, so it installs over the previous build."
